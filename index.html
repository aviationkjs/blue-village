<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>파란 선 마을</title>
<meta name="description" content="파란 선 집 그림으로 마을을 짓고 감상하고, 틀린 그림 찾기를 하는 게임">
<meta name="theme-color" content="#3f7fe8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="파란선마을">
<meta property="og:title" content="파란 선 마을">
<meta property="og:description" content="파란 선 집 그림으로 마을을 짓고 감상하고, 틀린 그림 찾기를 하는 게임">
<meta property="og:type" content="website">
<style>html{-webkit-text-size-adjust:100%}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
  /* Layout: full-bleed 3D board; toolbar on top, hint strip + category drawer at the bottom.
     Spot-the-difference is a full-screen overlay with two synced views. One deliberate paper-blue look. */
  :root {
    --paper: #f3f7ff;
    --ink: #1d3f86;
    --blue: #3f7fe8;
    --blue-deep: #1b5fd6;
    --blue-soft: #dbe7fd;
    --card: rgba(255, 255, 255, 0.92);
    --danger: #d64045;
    --found: #e5484d;
    --font-display: "Jua", "Gowun Dodum", system-ui, sans-serif;
    --font-body: "Gowun Dodum", system-ui, -apple-system, "Malgun Gothic", sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
  body.night { --paper: #0d1730; --ink: #e3ecff; --card: rgba(18, 32, 66, 0.9); --blue-soft: #22396b; --blue: #8fb6ff; --blue-deep: #b9d0ff; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  body.painting #scene { cursor: crosshair; }

  button { font: 400 15px var(--font-display); color: var(--blue); background: var(--card); border: 2px solid var(--blue); border-radius: 999px; padding: 6px 12px; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
  button:hover:not(:disabled), button[aria-pressed="true"] { background: var(--blue); color: var(--paper); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 3px solid var(--blue-deep); outline-offset: 2px; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button.danger:hover { background: var(--danger); color: #fff; }
  button.primary { background: var(--blue); color: var(--paper); }

  header {
    position: fixed; top: 0; left: 0; right: 0;
    padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; pointer-events: none;
  }
  header > * { pointer-events: auto; }
  h1 { margin: 0; font: 400 24px var(--font-display); color: var(--blue); }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .menu { position: relative; }
  .menu-pop { position: absolute; right: 0; top: calc(100% + 6px); background: var(--card); border: 2px solid var(--blue); border-radius: 14px; padding: 8px; display: grid; gap: 6px; min-width: 210px; z-index: 5; }
  .menu-pop button { border-radius: 10px; text-align: left; }

  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 8px; pointer-events: none;
  }
  .bottom > * { pointer-events: auto; }
  .hint { justify-self: center; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; background: var(--card); border: 2px solid var(--blue); border-radius: 16px; padding: 6px 8px 6px 14px; max-width: 100%; }
  .hint span { font-size: 15px; }
  .hint span b { font-family: var(--font-display); font-weight: 400; color: var(--blue); }
  .drawer { background: var(--card); border: 2px solid var(--blue); border-radius: 18px; padding: 8px; display: grid; gap: 8px; min-width: 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button { padding: 4px 11px; font-size: 14px; }
  .tabs button small { font-family: var(--font-body); opacity: .7; margin-left: 3px; }
  .cards { display: flex; flex-wrap: wrap; gap: 6px; max-height: 30vh; overflow-y: auto; }
  .pick { width: 76px; height: 88px; border-radius: 12px; padding: 4px; display: grid; grid-template-rows: 1fr auto; place-items: center; gap: 2px; }
  .pick img { width: 58px; height: 58px; object-fit: contain; pointer-events: none; }
  .pick small { font: 400 13px var(--font-display); }

  #exitView { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); }
  body.appreciate header, body.appreciate .bottom { display: none; }
  body:not(.appreciate) #exitView { display: none; }

  #toast { position: fixed; top: calc(64px + env(safe-area-inset-top, 0px)); left: 50%; transform: translate(-50%, -8px); background: var(--blue-deep); color: var(--paper); font: 400 15px var(--font-display); padding: 7px 16px; border-radius: 999px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; z-index: 30; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.good { background: var(--found); }

  /* spot the difference */
  #spot { position: fixed; inset: 0; z-index: 20; background: var(--paper); display: grid; grid-template-rows: auto 1fr; }
  .spot-bar {
    padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  }
  .spot-bar h2 { margin: 0; font: 400 22px var(--font-display); color: var(--blue); }
  .spot-bar .score { font: 400 17px var(--font-display); color: var(--ink); margin-right: auto; display: flex; gap: 4px; align-items: center; }
  .dots { display: inline-flex; gap: 4px; margin-left: 6px; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--found); display: inline-block; }
  .dots i.on { background: var(--found); }
  .spot-views {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; min-height: 0;
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .spot-view { position: relative; min-width: 0; min-height: 0; border: 2px solid var(--blue); border-radius: 16px; overflow: hidden; }
  .spot-view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .spot-view span { position: absolute; top: 8px; left: 8px; background: var(--card); border: 2px solid var(--blue); border-radius: 999px; padding: 2px 10px; font: 400 14px var(--font-display); color: var(--blue); pointer-events: none; }
  @media (max-aspect-ratio: 1/1) { .spot-views { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--paper); font: 400 20px var(--font-display); color: var(--blue); z-index: 40; }

  /* icon buttons: icon + label on wide screens, icon only on phones */
  .ib { display: inline-flex; align-items: center; gap: 5px; }
  .ib svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #bNight .i-sun, #bNight[aria-pressed="true"] .i-moon { display: none; }
  #bNight[aria-pressed="true"] .i-sun { display: block; }
  .drawer-top { display: flex; gap: 6px; align-items: center; min-width: 0; }
  .drawer-top .tabs { flex: 1; min-width: 0; }
  .fold { flex: none; width: 34px; height: 34px; padding: 0; display: grid; place-items: center; }
  .fold svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s; }
  .drawer.folded .fold svg { transform: rotate(180deg); }
  .drawer.folded .cards { display: none; }
  /* paint mode: the drawer becomes a colour palette */
  body.coloring .drawer-top, body.coloring .cards { display: none; }
  body:not(.coloring) .palette { display: none; }
  .palette { display: grid; gap: 6px; min-width: 0; }
  .strip { display: grid; grid-template-columns: repeat(16, 1fr); border: 2px solid var(--blue); border-radius: 10px; overflow: hidden; }
  .seg { height: 32px; min-width: 0; padding: 0; border: 0; border-radius: 0; background: var(--c); }
  .seg:hover:not(:disabled) { background: var(--c); }
  .seg[aria-pressed="true"] { box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 5px var(--blue-deep); position: relative; z-index: 1; }
  .tools-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .tools-row .grow { flex: 1; }
  .cur { width: 34px; height: 34px; border-radius: 10px; background: var(--c); border: 2px solid var(--blue); flex: none; }
  .mini { width: 38px; height: 34px; padding: 0; display: grid; place-items: center; border-radius: 10px; flex: none; }
  .mini svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .hint .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--blue); vertical-align: -2px; margin-right: 5px; }
  .sw { width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 3px solid var(--card); box-shadow: 0 0 0 2px var(--blue); background: var(--c); flex: none; }
  .sw:hover:not(:disabled) { background: var(--c); }
  .sw[aria-checked="true"] { box-shadow: 0 0 0 3px var(--blue-deep), 0 0 0 6px var(--card); transform: scale(1.08); }
  .sw.white { background: #fff; display: grid; place-items: center; color: var(--blue); font-size: 12px; }
  .palette .auto { margin-left: auto; }
  .rainbow-text { background: linear-gradient(90deg, #ff6b6b, #ffa94d, #e0b000, #40c057, #4dabf7, #7950f2, #e64980); -webkit-background-clip: text; background-clip: text; color: transparent; }

  @media (max-width: 640px), (max-height: 520px) {
    header { padding: calc(6px + env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px)); }
    h1 { display: none; }
    .tools { flex-wrap: nowrap; gap: 4px; width: 100%; justify-content: space-between; }
    button { font-size: 13px; padding: 4px 10px; }
    .ib { width: 38px; height: 38px; padding: 0; justify-content: center; }
    .ib svg { width: 20px; height: 20px; }
    .ib .lbl { display: none; }
    .menu-pop button { font-size: 15px; padding: 9px 12px; }

    .bottom { gap: 6px; padding: 0 max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
    .hint { padding: 3px 4px 3px 12px; border-radius: 14px; gap: 4px; }
    .hint span { font-size: 13px; }
    .hint.idle { display: none; }
    .drawer { padding: 6px; gap: 6px; border-radius: 14px; }
    .tabs, .cards { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; }
    .tabs::-webkit-scrollbar, .cards::-webkit-scrollbar { display: none; }
    .tabs button { flex: none; padding: 5px 11px; font-size: 13px; }
    .tabs button small { display: none; }
    .cards { max-height: none; gap: 5px; }
    .pick { flex: none; width: 62px; height: 70px; border-radius: 10px; padding: 3px; }
    .pick img { width: 44px; height: 44px; }
    .pick small { font-size: 12px; }
    .ib { width: 36px; height: 36px; }
    .palette { gap: 5px; }
    .seg { height: 30px; }
    .sw { width: 28px; height: 28px; border-width: 2px; }
    .tools-row { gap: 5px; }
    .cur { width: 30px; height: 30px; }
    .spot-bar .lbl-s { display: none; }
    .spot-bar button { padding: 4px 9px; }

    #toast { top: calc(56px + env(safe-area-inset-top, 0px)); font-size: 14px; }
    .spot-bar { padding: calc(6px + env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px)); gap: 6px; }
    .spot-bar h2 { display: none; }
    .spot-bar .score { font-size: 15px; }
    .spot-views { gap: 6px; padding: 0 max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
  }
  /* landscape phone: cards row only, drawer narrower */
  @media (max-height: 520px) and (min-aspect-ratio: 1/1) {
    .bottom { left: 50%; right: auto; transform: translateX(-50%); width: min(720px, 100%); }
    .pick { width: 54px; height: 60px; }
    .pick img { width: 38px; height: 38px; }
  }

  /* dialogs: village list, wallpaper, photo statue */
  .dlg { position: fixed; inset: 0; z-index: 25; background: rgba(13, 23, 48, 0.35); display: grid; place-items: center; padding: max(12px, env(safe-area-inset-top, 0px)) 12px max(12px, env(safe-area-inset-bottom, 0px)); }
  .dlg-box { box-sizing: border-box; width: min(440px, 100%); max-height: 100%; overflow-y: auto; background: var(--paper); border: 2px solid var(--blue); border-radius: 18px; padding: 12px; display: grid; gap: 10px; }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dlg-head h2 { margin: 0; font: 400 20px var(--font-display); color: var(--blue); }
  .dlg-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .dlg-row .gap { flex: 1; }
  .note { color: var(--ink); opacity: .75; font-size: 13px; line-height: 1.45; }
  .slot-list { display: grid; gap: 8px; }
  .slot { display: grid; grid-template-columns: 84px 1fr auto; gap: 8px; align-items: center; border: 2px solid var(--blue-soft); border-radius: 14px; padding: 6px; background: var(--card); }
  .slot.is-cur { border-color: var(--blue); }
  .slot img { width: 84px; height: 60px; object-fit: cover; border-radius: 10px; background: var(--blue-soft); }
  .slot-mid { display: grid; gap: 2px; min-width: 0; }
  .slot-mid input { font: 400 16px var(--font-display); color: var(--ink); background: transparent; border: 0; border-bottom: 1.5px dashed var(--blue-soft); padding: 2px 0; min-width: 0; width: 100%; }
  .slot-mid small { font-size: 12px; opacity: .7; }
  .slot-acts { display: grid; gap: 4px; }
  .slot-acts button { padding: 4px 10px; font-size: 13px; }
  .wall-img { width: 100%; max-height: 52vh; object-fit: contain; border-radius: 12px; border: 2px solid var(--blue-soft); background: var(--blue-soft); }
  .file-btn { justify-self: start; font: 400 15px var(--font-display); color: var(--paper); background: var(--blue); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  .file-btn input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .photo-prev { width: 100%; max-height: 42vh; object-fit: contain; border-radius: 12px; border: 2px solid var(--blue-soft); background: #fff; }
  .photo-prev[width="0"] { display: none; }
  .slider { display: flex; align-items: center; gap: 8px; font: 400 15px var(--font-display); color: var(--blue); }
  .slider input { flex: 1; accent-color: var(--blue); }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

</head>
<body>
<canvas id="scene" aria-label="마을을 짓는 3D 바닥"></canvas>

<header>
  <h1>파란 선 마을</h1>
  <div class="tools">
    <button id="bUndo" class="ib" type="button" aria-label="되돌리기" title="되돌리기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6L4 11l5 5"/><path d="M4 11h10a5 5 0 0 1 0 10h-3"/></svg><span class="lbl">되돌리기</span></button>
    <button id="bRedo" class="ib" type="button" aria-label="다시하기" title="다시하기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l5 5-5 5"/><path d="M20 11H10a5 5 0 0 0 0 10h3"/></svg><span class="lbl">다시하기</span></button>
    <button id="bPaint" class="ib" type="button" aria-label="칠하기" title="칠하기" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5l5 5-7.5 7.5-5-5z"/><path d="M7 12c-2.2.3-3.3 1.8-3.4 3.8-.1 1.6-.7 2.6-1.6 3.2 3.2 1 6.6.4 7.9-1.9.6-1.1.6-2.2.1-3.1"/></svg><span class="lbl">칠하기</span></button>
    <button id="bRoads" class="ib" type="button" aria-label="길 잇기" title="길 잇기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3L5 21M16 3l3 18M12 4v3M12 10.5v3M12 17v3"/></svg><span class="lbl">길 잇기</span></button>
    <button id="bDeco" class="ib" type="button" aria-label="꾸미기" title="꾸미기"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="6"/><path d="M12 15v6M9 21h6"/></svg><span class="lbl">꾸미기</span></button>
    <button id="bSpot" class="ib" type="button" aria-label="틀린 그림" title="틀린 그림"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><span class="lbl">틀린 그림</span></button>
    <button id="bView" class="ib" type="button" aria-label="감상" title="감상"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="lbl">감상</span></button>
    <button id="bNight" class="ib" type="button" aria-label="밤" title="밤" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="i-moon" d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/><g class="i-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg><span class="lbl">밤</span></button>
    <div class="menu">
      <button id="bMenu" class="ib" type="button" aria-expanded="false" aria-controls="menuPop" aria-label="더 보기" title="더 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
      <div class="menu-pop" id="menuPop" hidden>
        <button id="bSlots" type="button">마을 목록 (여러 마을 저장)</button>
        <button id="bWall" type="button">배경화면 저장</button>
        <button id="bRainbow" type="button">무지개 자동 칠하기</button>
        <button id="bUnpaint" type="button">색 모두 지우기</button>
        <button id="bExample" type="button">예시 마을 다시 짓기</button>
        <button id="bNew" type="button" class="danger">새 마을 (모두 비우기)</button>
      </div>
    </div>
  </div>
</header>

<div class="bottom">
  <div class="hint" id="hint" role="status" aria-live="polite"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-top">
      <div class="tabs" id="tabs" role="tablist" aria-label="분류"></div>
      <button id="bFold" class="fold" type="button" aria-expanded="true" aria-controls="cards" aria-label="카드 접기" title="카드 접기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>
    <div class="cards" id="cards"></div>
    <div class="palette" id="palette" role="radiogroup" aria-label="칠할 색"></div>
  </div>
</div>

<button id="exitView" type="button">감상 끝내기</button>

<div id="spot" hidden>
  <div class="spot-bar">
    <h2>틀린 그림 찾기</h2>
    <div class="score" id="spotScore" role="status" aria-live="polite"></div>
    <button id="spotHint" type="button">힌트</button>
    <button id="spotNew" type="button">새 문제</button>
    <button id="spotExit" type="button">끝내기</button>
  </div>
  <div class="spot-views">
    <div class="spot-view"><canvas id="spotA" aria-label="원래 마을"></canvas><span>원래 마을</span></div>
    <div class="spot-view"><canvas id="spotB" aria-label="바뀐 마을"></canvas><span>바뀐 마을</span></div>
  </div>
</div>


<div id="slotDlg" class="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="slotTitle">
  <div class="dlg-box">
    <div class="dlg-head"><h2 id="slotTitle">마을 목록</h2><button type="button" data-close="slotDlg">닫기</button></div>
    <div id="slotList" class="slot-list"></div>
    <div class="dlg-row"><button id="slotNew" type="button">+ 빈 마을</button><button id="slotExample" type="button">+ 예시 마을</button><button id="slotCopy" type="button">지금 마을 복사</button></div>
  </div>
</div>

<div id="wallDlg" class="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="wallTitle">
  <div class="dlg-box">
    <div class="dlg-head"><h2 id="wallTitle">배경화면 저장</h2><button type="button" data-close="wallDlg">닫기</button></div>
    <div class="dlg-row seg2"><button id="wallDay" type="button">낮</button><button id="wallNight" type="button">밤</button><span class="gap"></span><button id="wallPort" type="button">세로</button><button id="wallLand" type="button">가로</button></div>
    <img id="wallImg" class="wall-img" alt="배경화면 미리보기">
    <small id="wallInfo" class="note"></small>
    <div class="dlg-row"><button id="wallSave" type="button" class="primary">사진으로 저장</button><button id="wallShare" type="button">공유 · 배경화면 설정</button></div>
  </div>
</div>

<div id="photoDlg" class="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="photoTitle">
  <div class="dlg-box">
    <div class="dlg-head"><h2 id="photoTitle">사진으로 동상 만들기</h2><button type="button" data-close="photoDlg">닫기</button></div>
    <label class="file-btn">사진 고르기<input id="photoFile" type="file" accept="image/*"></label>
    <canvas id="photoPrev" class="photo-prev" width="0" height="0"></canvas>
    <label class="slider">선 세밀함 <input id="photoDetail" type="range" min="0" max="100" value="45"></label>
    <small class="note">사진은 이 기기 안에서만 선 그림으로 바뀌고 어디에도 올라가지 않아요. 배경이 단순할수록 깔끔해요.</small>
    <div class="dlg-row"><button id="photoMake" type="button" class="primary" disabled>동상 만들기</button></div>
  </div>
</div>

<div id="toast"></div>
<div id="loading">마을을 준비하는 중…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="js/grid.js"></script>
<script src="js/roads.js"></script>
<script src="js/decorate.js"></script>
<script src="js/spot.js"></script>
<script src="js/cats.js"></script>
<script src="js/sheet.js"></script>
<script src="js/models3d.js"></script>
<script src="js/house3d.js"></script>
<script src="js/photo.js"></script>
<script src="js/scene.js"></script>
<script src="js/main.js"></script>

<script src="js/pwa.js"></script>
</body>
</html>
